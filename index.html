<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="枫海蒹葭">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="《枫海蒹葭》小说DLC。一张时间之外的纸条，一段未完的回响。">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./images/blackleaf.PNG">
  <link rel="apple-touch-icon" href="./images/blackleaf.PNG">
  <link rel="preload" as="image" href="./images/river-opening.webp">
  <link rel="stylesheet" href="./style.css?v=20260906">
  <script defer src="./vendor/icons.js"></script>
  <script defer src="./firebase-config.js"></script>
  <script defer src="./story-data.js?v=20260906"></script>
  <script defer src="./script.js?v=20260906"></script>
  <title>枫海蒹葭 · 时间之外</title>
</head>
<body data-stage="0">
  <header class="site-header">
    <button id="goHome" class="brand" aria-label="返回枫海蒹葭首页">
      <img src="./images/blackleaf.PNG" width="28" height="28" alt="">
      <span>枫海蒹葭<span class="brand-sub">时间之外的往事</span></span>
    </button>
    <div class="header-tools">
      <button id="hapticToggle" class="icon-button" aria-label="关闭触感" aria-pressed="true" title="关闭触感" hidden><i data-lucide="vibrate"></i></button>
      <button id="soundToggle" class="icon-button" aria-label="开启声音" aria-pressed="false" title="开启声音"><i data-lucide="volume-x"></i></button>
    </div>
  </header>
  <main id="app">
    <section id="stage0" class="stage home is-active" aria-labelledby="homeTitle">
      <img class="home-art" src="./images/river-opening.webp" alt="一片红枫叶漂在银灰色的水面上" fetchpriority="high">
      <div class="home-content">
        <p class="eyebrow">小说余篇 / XanderG</p>
        <h1 id="homeTitle">枫海蒹葭</h1>
        <p class="home-subtitle">一张时间之外的纸条</p>
        <div class="home-actions">
          <button id="enterArchive" class="primary-button"><span>打开记忆</span><i data-lucide="arrow-right"></i></button>
          <button id="restartMemory" class="text-button" hidden>从头回忆</button>
        </div>
      </div>
      <footer class="home-footer"><span>所谓伊人，在水一方。</span><span>献给读到这里的你</span></footer>
    </section>
    <section id="stage1" class="stage verification" aria-label="记忆验证" hidden>
      <div class="verification-inner">
        <p class="eyebrow">只有我们知道的事</p>
        <div id="verifyCard">
          <div id="quizPanel"></div>
          <p id="rejectText" role="status"></p>
          <button id="retryQuiz" class="text-button" hidden>再试一次 <i data-lucide="rotate-ccw"></i></button>
        </div>
        <form id="nameCard" hidden>
          <label class="section-title" for="nicknameInput">留下痕迹。</label>
          <input id="nicknameInput" type="text" maxlength="18" autocomplete="nickname" placeholder="你的名字" required>
          <button class="primary-button" type="submit">进入 <i data-lucide="arrow-right"></i></button>
        </form>
      </div>
    </section>
    <section id="stage2" class="stage unlock" aria-label="解锁记忆" hidden>
      <p class="unlock-caption eyebrow">过往温柔，封存于此</p>
      <button id="leafLock" class="leaf-lock" aria-label="轻触解锁">
        <img class="black-leaf" src="./images/blackleaf.PNG" alt="">
        <img class="black-lock" src="./images/blacklock.PNG" alt="">
      </button>
      <button id="unlockHint" class="text-button unlock-hint">轻触解锁 <i data-lucide="arrow-right"></i></button>
      <button id="beginMemory" class="primary-button begin-memory" hidden>开始回忆 <i data-lucide="arrow-right"></i></button>
    </section>
    <section id="stage3" class="stage reader" aria-label="回忆" hidden>
      <div class="reader-heading"><span id="chapterName">序 · 倒带</span><span id="frameNumber">01</span></div>
      <div id="scrollWorld" class="scroll-world">
        <img id="memoryImage" class="memory-image" alt="" draggable="false">
        <p id="memoText" class="memo-text" hidden></p>
        <div id="imageStatus" class="image-status" role="status" hidden>
          <span id="imageMessage">正在展开这一帧</span>
          <button id="retryImage" class="text-button" hidden>重新载入 <i data-lucide="rotate-ccw"></i></button>
        </div>
      </div>
      <nav class="reader-navigation" aria-label="回忆翻页">
        <button id="previousFrame" class="icon-button" aria-label="上一帧" title="上一帧"><i data-lucide="arrow-up"></i></button>
        <div class="reader-position"><span id="frameCaption">时间的另一端</span><progress id="memoryProgress" aria-label="阅读进度" max="100" value="0"></progress></div>
        <button id="nextFrame" class="icon-button" aria-label="下一帧" title="下一帧"><i data-lucide="arrow-down"></i></button>
      </nav>
    </section>
    <section id="stage4" class="stage keepsake" aria-label="一只留给你的耳机" hidden>
      <div class="keepsake-heading"><p class="eyebrow">时间带不走的</p><p class="keepsake-quote">“分你一只。”</p></div>
      <button id="casePickup" class="case-pickup" aria-label="拾取耳机盒"><img src="./images/ap4m.PNG" alt="AirPods耳机盒"></button>
      <div id="podsPair" class="pods-pair" hidden><img src="./images/ap4left.PNG" alt="左耳机"><img src="./images/ap4right.PNG" alt="右耳机"></div>
      <button id="wearPods" class="text-button keepsake-action">点击拾取 <i data-lucide="arrow-up-right"></i></button>
      <div id="film" class="film" hidden>
        <video id="jyyVideo" src="./jyy/jyy.mp4" preload="none" playsinline webkit-playsinline></video>
        <div id="videoFallback" class="video-fallback" hidden><p id="videoMessage">这一段声音，还在等你。</p><button id="retryVideo" class="primary-button">播放 <i data-lucide="play"></i></button></div>
        <button id="skipFilm" class="icon-button film-skip" aria-label="前往尾声" title="前往尾声"><i data-lucide="skip-forward"></i></button>
      </div>
    </section>
    <section id="stage5" class="stage ending" aria-label="尾声" hidden>
      <img class="ending-leaf" src="./images/blackleaf.PNG" alt="">
      <div id="endingCopy" class="ending-copy"><p>感谢欣赏《枫海蒹葭》DLC</p><p>我们下个宇宙帧再见</p></div>
      <button id="traceButton" class="trace-button" hidden><i data-lucide="message-circle"></i><span>留下痕迹</span></button>
      <button id="readAgain" class="text-button ending-again">再看一遍 <i data-lucide="rotate-ccw"></i></button>
    </section>
    <section id="stage6" class="stage reviews" aria-labelledby="reviewTitle" hidden>
      <div class="reviews-inner">
        <p class="eyebrow">文字会替我们抵达</p><h2 id="reviewTitle">留下痕迹。</h2>
        <form id="reviewForm" class="review-form">
          <label class="sr-only" for="reviewInput">写下你的书评</label>
          <textarea id="reviewInput" maxlength="600" rows="4" placeholder="写下你的书评" required></textarea>
          <div class="review-meta"><span id="storageNote">保存在此设备</span><span id="reviewCount">0 / 600</span></div>
          <button id="sendReview" class="primary-button" type="submit">留下书评 <i data-lucide="send"></i></button>
          <p id="reviewStatus" class="status" role="status"></p>
        </form>
        <div id="commentSea" class="comment-sea" aria-live="polite"></div>
        <button id="backToMemory" class="text-button">回到尾声 <i data-lucide="arrow-left"></i></button>
      </div>
    </section>
  </main>
  <audio id="bgm" src="./music/bgm.m4a" preload="none" loop></audio>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="noscript-note">这段回忆需要启用 JavaScript 才能打开。</p></noscript>
</body>
</html>
